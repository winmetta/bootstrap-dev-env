name: CI

# The same checks as the local git hooks (lefthook.yml), so a skipped hook or a
# contributor without the bootstrap script cannot get past them. The job is called
# "checks" because the branch ruleset requires a status check with that name.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash32-tests:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test error reporting on Bash 3.2
        # macOS bundles Bash 3.2 at /bin/bash; select it explicitly instead of a newer Bash on PATH.
        shell: /bin/bash -e {0}
        run: |
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == 3.2 ]]
          /bin/bash scripts/test-error-reporting.sh

  checks:
    needs: bash32-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the history, and the commit check reads the PR's commits.
          fetch-depth: 0
      # The tools the local hooks use, pinned to the latest stable versions as of
      # 2026-10-10. To update: look up each version (mise latest <tool>), change it
      # here, and let the checks run on the PR.
      - name: Install the check tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          mise_toml: |
            [tools]
            actionlint = "1.7.12"
            gitleaks = "8.30.1"
            lefthook = "2.2.1"
            node = "24"
            "npm:markdownlint-cli2" = "0.23.3"
            "npm:prettier" = "3.9.9"
            shellcheck = "0.11.0"
            shfmt = "3.14.1"
      - name: Run the pre-commit checks on every file
        run: lefthook run pre-commit --all-files
      - name: Test error reporting
        run: bash scripts/test-error-reporting.sh
      # The hook only scans what is staged, so scan the whole history here.
      - name: Scan the git history for secrets
        run: gitleaks git --redact --no-banner
      # The PR title becomes the commit subject when the PR is squash-merged.
      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/conventional-commit.sh -s "$PR_TITLE"
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            scripts/conventional-commit.sh -s "$subject"
          done
